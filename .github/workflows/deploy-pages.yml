name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Resolve site URL
        id: site
        run: |
          echo "url=${SITE_URL_VAR:-https://jaku2019.github.io/wrs-eiti-strona}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE_VAR:-/wrs-eiti-strona/}" >> "$GITHUB_OUTPUT"
        env:
          SITE_URL_VAR: ${{ vars.SITE_URL }}
          BASE_VAR: ${{ vars.NUXT_APP_BASE_URL }}
      - name: Generate
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
          NUXT_APP_BASE_URL: ${{ steps.site.outputs.base }}
        run: npm run generate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
